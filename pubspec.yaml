name: flutter_application_1
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  # UI & App
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.0

  # Permission & Local Media
  permission_handler: ^11.3.1
  photo_manager: ^3.0.0

  # Audio & Video
  just_audio: ^0.9.36
  video_player: ^2.8.6

  # API (Pixabay & Jamendo)
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/image/app_logo.png

flutter_native_splash:
  color: "#352F52"
  image: assets/image/app_logo.png
  android_12:
    color: "#352F52"
    image: assets/image/app_logo.png
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true
  assets:
    - assets/image/app_logo.png
